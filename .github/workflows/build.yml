name: Build
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fabric-client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: fabric-client
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Blueprints-Fabric-Client
          path: fabric-client/build/libs/blueprints-client-*.jar
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Blueprints-Paper
          path: server-plugin/build/libs/*.jar
